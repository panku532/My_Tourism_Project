<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Travel Buddy - Smart Tourism & Travel Platform with real-time weather, 3D perspective animations, smart itineraries, and local business hub.">
    <title>Travel Buddy – Smart Tourism & Travel Platform</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React 18 & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

    <!-- Babel Standalone for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind Custom Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#0A2533',
                            DEFAULT: '#0F2C39',
                            coral: '#FF6B4A',
                            coralHover: '#E85A38',
                            sand: '#F9F8F6',
                            accent: '#38BDF8',
                        }
                    }
                }
            }
        }
    </script>

    <!-- External Modular Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <!-- React Mount Node -->
    <div id="root"></div>

    <!-- 1. Data Store & Utilities (Standard JavaScript) -->
    <script src="js/data.js"></script>
    <script src="js/weather.js"></script>

    <!-- 2. Modular React Components (Babel JSX) -->
    <script type="text/babel" src="js/components/Navbar.js"></script>
    <script type="text/babel" src="js/components/WeatherBar.js"></script>
    <script type="text/babel" src="js/components/HomeTab.js"></script>
    <script type="text/babel" src="js/components/ExploreTab.js"></script>
    <script type="text/babel" src="js/components/TripPlannerTab.js"></script>
    <script type="text/babel" src="js/components/HotelsTab.js"></script>
    <script type="text/babel" src="js/components/BusinessHubTab.js"></script>
    <script type="text/babel" src="js/components/ReviewsTab.js"></script>
    <script type="text/babel" src="js/components/AnimationTourTab.js"></script>
    <script type="text/babel" src="js/components/Modals.js"></script>
    <script type="text/babel" src="js/components/Footer.js"></script>

    <!-- 3. Main Application Entry Point -->
    <script type="text/babel" src="js/app.js"></script>

    <!-- Helper Notice for local file:// protocol -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.protocol === 'file:') {
                setTimeout(() => {
                    const root = document.getElementById('root');
                    if (root && root.innerHTML.trim() === '') {
                        const notice = document.createElement('div');
                        notice.className = 'p-6 m-6 bg-amber-50 border-2 border-amber-400 rounded-2xl text-slate-800 shadow-xl max-w-2xl mx-auto font-sans';
                        notice.innerHTML = `
                            <div class="flex items-center gap-3 mb-3">
                                <span class="text-3xl">🚀</span>
                                <h2 class="text-xl font-bold text-amber-900">Run via Local Server (CORS Policy)</h2>
                            </div>
                            <p class="text-sm text-slate-700 mb-4 leading-relaxed">
                                Modern browsers (Chrome/Edge) restrict external script loading over the <code>file:///</code> protocol.
                            </p>
                            <div class="bg-white p-4 rounded-xl border border-amber-200 text-sm space-y-2 mb-4">
                                <p class="font-bold text-brand">Easy ways to run:</p>
                                <p>1. <strong>Double-click <code>start.bat</code></strong> in this folder (starts built-in local server instantly!).</p>
                                <p>2. Or in VS Code, right-click <code>index.html</code> &rarr; <strong>"Open with Live Server"</strong>.</p>
                                <p>3. Or run <code>npm start</code> in your terminal.</p>
                            </div>
                        `;
                        root.appendChild(notice);
                    }
                }, 1200);
            }
        });
    </script>
</body>

</html>
